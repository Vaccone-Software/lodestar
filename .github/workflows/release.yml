name: Release

# Push a tag `vX.Y.Z` that matches Version.swift and this ships it: test,
# universal build, Developer ID sign, notarize, staple, DMG, GitHub
# release from notes/vX.Y.Z.md, cask bump. Then a second job on a clean
# runner downloads what was actually published and proves it: Gatekeeper
# accepts it, the staple is attached, the binary runs and reports the
# version, the cask sha matches, and the version is numerically newer
# than the previous release (the updater compares numbers, so a tag that
# sorts backwards would strand every install).
#
# ship.sh gets here too, and that is the common case: `gh release create`
# is what creates the tag, so this workflow wakes up on a release that is
# already published. It then builds nothing — the first step after the
# version check looks for that release and skips the whole build, secrets
# included. The verify job still runs, so a local ship is still proved on
# a clean runner. Nothing below the skip may run before it.
#
# Secrets (one-time setup, see PUBLISHING.md):
#   MACOS_CERT_P12        Developer ID Application cert + key, base64 .p12
#   MACOS_CERT_PASSWORD   the .p12 export password
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD   (Apple ID form)
#     — or —
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8    (API key form)
#   TAP_TOKEN             fine-grained PAT, contents:write on homebrew-tap

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # A dry run: test, build, sign, notarize, staple, and attach the
    # artifacts to this run. Publishes nothing, so the daily updater
    # never sees it. Runs against whatever Version.swift says on the
    # chosen ref; no tag needed.

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Version.swift
        id: version
        run: |
          VERSION=$(grep 'public static let version' Sources/LodestarCore/Version.swift | cut -d'"' -f2)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$TAG" ]; then
              echo "✕ tag v$TAG but Version.swift says $VERSION"; exit 1
            fi
          fi
          [ -f "notes/v$VERSION.md" ] || { echo "✕ notes/v$VERSION.md missing — a release without notes is not a release"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: A release already published by ship.sh is not built again
        if: github.event_name == 'push'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v${{ steps.version.outputs.version }} already exists (shipped locally); nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.existing.outputs.skip != 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          [ -n "$CERT_P12" ] || { echo "✕ MACOS_CERT_P12 is not set — this repo has no CI signing secrets, so CI cannot build a release. Ship with ./scripts/ship.sh, or set the secrets listed in PUBLISHING.md"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "✕ no Developer ID Application identity in the imported certificate"; exit 1; }

      - name: Store notary credentials
        if: steps.existing.outputs.skip != 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -n "$KEY_ID" ]; then
            echo "$KEY_P8" > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials lodestar-notary \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
            rm "$RUNNER_TEMP/notary.p8"
          elif [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials lodestar-notary \
              --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD"
          else
            echo "✕ no notary secrets configured"; exit 1
          fi

      - name: Test, build, sign, notarize, staple
        if: steps.existing.outputs.skip != 'true'
        run: ./scripts/release.sh

      - name: Attach artifacts to the run (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lodestar-${{ steps.version.outputs.version }}
          path: |
            dist/lodestar-${{ steps.version.outputs.version }}.zip
            dist/lodestar-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE=""
          case "$VERSION" in 0.*) PRERELEASE="--prerelease";; esac
          gh release create "v$VERSION" \
            "dist/lodestar-$VERSION.zip" "dist/lodestar-$VERSION.dmg" \
            $PRERELEASE --title "Lodestar $VERSION" --notes-file "notes/v$VERSION.md" \
            --repo "$GITHUB_REPOSITORY"

      - name: Bump cask
        if: github.event_name == 'push' && steps.existing.outputs.skip != 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: ./scripts/bump-cask.sh "${{ steps.version.outputs.version }}" "dist/lodestar-${{ steps.version.outputs.version }}.zip"

      - name: Drop the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true

  verify:
    needs: release
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download what was published
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir dist
          ls -la dist

      - name: Gatekeeper and staple
        run: |
          ditto -x -k "dist/lodestar-$VERSION.zip" unpacked
          APP=unpacked/lodestar.app
          codesign --verify --strict --deep "$APP"
          spctl -a -vv -t exec "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "dist/lodestar-$VERSION.dmg"
          spctl -a -vv -t open --context context:primary-signature "dist/lodestar-$VERSION.dmg"

      - name: The binary runs and knows its version
        run: |
          APP=unpacked/lodestar.app
          BUNDLE=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          [ "$BUNDLE" = "$VERSION" ] || { echo "✕ bundle says $BUNDLE, tag says $VERSION"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/lodestar" | grep -q x86_64 || { echo "✕ not universal"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/lodestar" | grep -q arm64 || { echo "✕ not universal"; exit 1; }
          # `schema` touches no config, no socket, no permission: the
          # cheapest proof the binary links and starts on a clean machine.
          "$APP/Contents/MacOS/lodestar" schema | python3 -c 'import json,sys; json.load(sys.stdin)'

      - name: Cask points at this release
        run: |
          # ship.sh bumps the cask *after* `gh release create`, and that
          # create is what fired this run — so the tap can be a few seconds
          # behind us. Poll rather than lose the race. Read through the API,
          # not raw.githubusercontent.com, whose CDN would serve us the
          # pre-bump file for minutes after the push landed.
          SHA=$(shasum -a 256 "dist/lodestar-$VERSION.zip" | cut -d' ' -f1)
          cask() {
            gh api repos/Vaccone-Software/homebrew-tap/contents/Casks/lodestar.rb \
              -H 'Accept: application/vnd.github.raw' 2>/dev/null \
              || curl -fsSL "https://raw.githubusercontent.com/Vaccone-Software/homebrew-tap/main/Casks/lodestar.rb"
          }
          for attempt in $(seq 1 12); do
            CASK=$(cask || true)
            if echo "$CASK" | grep -q "version \"$VERSION\"" && echo "$CASK" | grep -q "sha256 \"$SHA\""; then
              echo "✓ cask → $VERSION ($SHA)"
              exit 0
            fi
            echo "cask not bumped yet (attempt $attempt/12); waiting 10s"
            sleep 10
          done
          echo "✕ cask still does not point at $VERSION / $SHA after two minutes; it says:"
          echo "$CASK" | grep -E 'version |sha256 ' || echo "  (could not read the cask at all)"
          exit 1

      - name: Numerically newer than the previous release
        run: |
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | .tagName | ltrimstr("v")] | map(select(. != "'"$VERSION"'")) | .[0]')
          [ -n "$PREV" ] || { echo "no previous release to compare against"; exit 0; }
          NEWEST=$(printf '%s\n%s\n' "$PREV" "$VERSION" | sort -V | tail -1)
          [ "$NEWEST" = "$VERSION" ] || { echo "✕ v$VERSION does not sort after previous v$PREV — the updater would never take it"; exit 1; }
          echo "✓ v$PREV → v$VERSION"
