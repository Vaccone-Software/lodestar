name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. Nothing here writes to the repository: checkout reads
# it, and the caches and artifacts are reached through the runner's own
# cache token, not GITHUB_TOKEN's scopes.
permissions:
  contents: read

# A pull request's older run is stopped when it is pushed to again: nobody
# reads its verdict. A push to main is never stopped, and never waits behind
# another (a group that only queues keeps one pending run and drops the
# rest), so every main commit gets a complete verdict: its own run id is
# its group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Stoic needs Swift 6.4 and the macOS 27 SDK: the runner Stoic's own CI
    # uses.
    runs-on: xcode-27
    # A hung build or test holds a runner for GitHub's default six hours;
    # the suite itself is a few minutes, and test.sh stops a hung shard.
    # The margin is for a cold cache, which builds MLX from source.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Xcode 27
        # Stoic needs Swift 6.4; the image's default Xcode may be older.
        run: sudo xcode-select -s /Applications/Xcode_27.0.app && swift --version

      - name: Metal toolchain
        # MLX compiles its GPU kernels with `metal`, a separate download
        # since Xcode 26; a runner image may not carry it. Xcode 27 ships a
        # `metal` stub that `xcrun -f` finds, so ask for the component itself.
        #
        # The download is the one network step outside the build, and a
        # blip in it has turned a run red before: three tries, 15 s then 30 s
        # apart (scripts/retry.sh). Nothing else is retried, and no test is.
        run: |
          source scripts/retry.sh
          xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q "Status: installed" \
            || RELEASE_TRIES=3 RELEASE_RETRY_DELAY=15 retry xcodebuild -downloadComponent MetalToolchain

      - name: Toolchain
        id: toolchain
        # A different Xcode is a different compiler: its build is not ours
        # to reuse, so its version is part of the cache key.
        run: echo "xcode=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      # The dependencies (MLX's C++ above all) are most of a clean build and
      # never change between our commits, so .build is restored from the
      # last run with the same toolchain and the same resolved packages.
      # Our own sources come from a fresh checkout, newer than anything in
      # the cache, so they always rebuild; a dependency bump misses the
      # exact key and starts from the nearest cache instead.
      - name: Restore the build
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}-
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-

      # The restored build plan names the Metal compiler by an absolute
      # path under a cryptex mount whose suffix is random per machine, so a
      # plan saved on one runner sends `metal` to a path the next one lacks.
      # Point each old mount at this runner's toolchain; if that cannot be
      # done, drop the plan (the compiled objects stay) and let it replan.
      - name: Point the cached build at this Metal toolchain
        run: |
          now=$(xcodebuild -showComponent MetalToolchain 2>/dev/null | sed -n 's/^Toolchain Search Path: //p')
          plan=.build/out/Intermediates.noindex/XCBuildData
          [ -d "$plan" ] || exit 0
          for old in $(grep -raoh '/var/run/com.apple.security.cryptexd/mnt/com.apple.MobileAsset.MetalToolchain-[^/]*' "$plan" | sort -u); do
            [ -e "$old" ] && continue
            if [ -n "$now" ] && [ -d "$now" ] && sudo ln -s "$now" "$old"; then
              echo "→ $old → $now"
            else
              echo "→ no Metal toolchain to point $old at; replanning"
              rm -rf "$plan"
              break
            fi
          done

      # The published keystroke dataset the replay tests read (7.3 MB),
      # cached by the script that fetches it. A failed or changed download
      # fails here: the script checks the archive's SHA-256, and the replay
      # tests may not skip on CI (Tests/allowed-skips.txt).
      - name: Restore the datasets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/lodestar-datasets
          key: datasets-${{ hashFiles('tools/health/fetch-datasets.sh') }}
      - name: Fetch the datasets
        run: ./tools/health/fetch-datasets.sh

      - name: Build
        run: swift build

      # The tests draw real windows, so what they draw on matters: the
      # display's size and scale and the Mac's appearance. A runner is not
      # our desk (a Retina Mac in Dark), and a failure that only the runner
      # shows has to be read against what the runner was.
      - name: The display and the look
        run: |
          system_profiler SPDisplaysDataType || true
          echo "appearance: $(defaults read -g AppleInterfaceStyle 2>/dev/null || echo Light)"
          swift - <<'SWIFT' || true
          import AppKit
          let screens = NSScreen.screens
          print("screens: \(screens.count)")
          for screen in screens {
              print("frame \(screen.frame) backingScaleFactor \(screen.backingScaleFactor)")
          }
          print("main backingScaleFactor: \(NSScreen.main?.backingScaleFactor ?? 0)")
          SWIFT

      - name: Test
        # Sharded across a few xctest processes: the same suite, about a
        # quarter of the wall time.
        #
        # TEST_SHARD_SECONDS is how long a shard's log may stand still
        # before it is read as a hang: 300 s on a desk. This runner is about
        # twice as slow, and its slowest single test has taken six minutes,
        # so it gets 600. A slow shard that keeps passing tests is never
        # stopped; the job's own timeout bounds the whole.
        env:
          TEST_SHARD_SECONDS: 600
        run: LODESTAR_DATASETS="$HOME/.cache/lodestar-datasets" ./scripts/test.sh

      # One result per test, passes too, whatever the run did: what
      # scripts/flake-history.sh counts failures from. The attempt is in the
      # name because a re-run of the same run may not reuse its first name.
      - name: The test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.run_attempt }}
          path: .build/test-results/junit.xml
          retention-days: 30
          if-no-files-found: ignore

      # A shard that hangs is sampled to <shard>.hang.txt, and each shard's
      # log says which test it was in: both are what a red run is read from.
      - name: The shards' logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-shards-${{ github.run_attempt }}
          path: |
            .build/test-shards/*.hang.txt
            .build/test-shards/*.log
            .build/test-shards/*.list
            .build/test-timings.txt
          if-no-files-found: warn

      # Saved from main only: pull requests restore main's build and add
      # nothing, so the repository's cache holds a few recent builds, not
      # one per branch.
      - name: Save the build
        if: github.event_name == 'push' && success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
