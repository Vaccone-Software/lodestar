name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The codebase compiles against the macOS 26 SDK (glass effect views,
    # availability gated at runtime) — the runner image must match.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
