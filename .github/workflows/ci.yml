name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Stoic needs Swift 6.4 and the macOS 27 SDK: the runner Stoic's own CI
    # uses.
    runs-on: xcode-27
    # A hung build or test holds a runner for GitHub's default six hours;
    # the suite itself is a few minutes, and test.sh stops a hung shard.
    # The margin is for a cold cache, which builds MLX from source.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 27
        # Stoic needs Swift 6.4; the image's default Xcode may be older.
        run: sudo xcode-select -s /Applications/Xcode_27.0.app && swift --version

      - name: Metal toolchain
        # MLX compiles its GPU kernels with `metal`, a separate download
        # since Xcode 26; a runner image may not carry it. Xcode 27 ships a
        # `metal` stub that `xcrun -f` finds, so ask for the component itself.
        run: |
          xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q "Status: installed" \
            || xcodebuild -downloadComponent MetalToolchain

      - name: Toolchain
        id: toolchain
        # A different Xcode is a different compiler: its build is not ours
        # to reuse, so its version is part of the cache key.
        run: echo "xcode=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      # The dependencies (MLX's C++ above all) are most of a clean build and
      # never change between our commits, so .build is restored from the
      # last run with the same toolchain and the same resolved packages.
      # Our own sources come from a fresh checkout, newer than anything in
      # the cache, so they always rebuild; a dependency bump misses the
      # exact key and starts from the nearest cache instead.
      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}-
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-

      # The restored build plan names the Metal compiler by an absolute
      # path under a cryptex mount whose suffix is random per machine, so a
      # plan saved on one runner sends `metal` to a path the next one lacks.
      # Point each old mount at this runner's toolchain; if that cannot be
      # done, drop the plan (the compiled objects stay) and let it replan.
      - name: Point the cached build at this Metal toolchain
        run: |
          now=$(xcodebuild -showComponent MetalToolchain 2>/dev/null | sed -n 's/^Toolchain Search Path: //p')
          plan=.build/out/Intermediates.noindex/XCBuildData
          [ -d "$plan" ] || exit 0
          for old in $(grep -raoh '/var/run/com.apple.security.cryptexd/mnt/com.apple.MobileAsset.MetalToolchain-[^/]*' "$plan" | sort -u); do
            [ -e "$old" ] && continue
            if [ -n "$now" ] && [ -d "$now" ] && sudo ln -s "$now" "$old"; then
              echo "→ $old → $now"
            else
              echo "→ no Metal toolchain to point $old at; replanning"
              rm -rf "$plan"
              break
            fi
          done

      # The published keystroke dataset the replay tests read (7.3 MB),
      # cached by the script that fetches it. A failed or changed download
      # fails here: the script checks the archive's SHA-256, and the replay
      # tests may not skip on CI (Tests/allowed-skips.txt).
      - name: Restore the datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/lodestar-datasets
          key: datasets-${{ hashFiles('tools/health/fetch-datasets.sh') }}
      - name: Fetch the datasets
        run: ./tools/health/fetch-datasets.sh

      - name: Build
        run: swift build
      - name: Test
        # Sharded across a few xctest processes: the same suite, about a
        # quarter of the wall time.
        run: LODESTAR_DATASETS="$HOME/.cache/lodestar-datasets" ./scripts/test.sh

      # Saved from main only: pull requests restore main's build and add
      # nothing, so the repository's cache holds a few recent builds, not
      # one per branch.
      - name: Save the build
        if: github.event_name == 'push' && success()
        uses: actions/cache/save@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
